[project]
name = "transcribeme"
version = "0.2.0"
description = "Live and batch diarized transcription with skill-driven summaries"
readme = "README.md"
# Pinned to one minor version so the lockfile resolves to the exact wheel set
# that has been tested on macOS and Windows.
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # Claude
    "anthropic>=1.5",
    # Diarization. On Windows and Intel Macs the PyPI torch wheels are CPU-only,
    # which is what we want; no custom index needed.
    "pyannote.audio>=4.0.7",
    "torch>=2.8",
    "torchaudio>=2.8",
    "soundfile>=0.12",
    # ASR: mlx-whisper on Apple Silicon (Metal), faster-whisper everywhere else.
    "mlx-whisper>=0.4.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1",
    # CLI / misc
    "rich>=13",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
transcribeme = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Resolve one lockfile for exactly the platforms we support.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
